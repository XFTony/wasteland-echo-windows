name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  legacy_reference:
    name: Legacy reference
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check public documentation entrypoints
        run: node scripts/maintenance/check-doc-entrypoints.mjs
      - run: npm run check

  native:
    name: Native Godot
    uses: ./.github/workflows/godot-native.yml

  check:
    name: check
    if: ${{ always() }}
    needs: [legacy_reference, native]
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - name: Require both regression results
        shell: pwsh
        env:
          LEGACY_RESULT: ${{ needs.legacy_reference.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          if ($env:LEGACY_RESULT -ne 'success' -or $env:NATIVE_RESULT -ne 'success') {
            throw "Required regressions failed: reference=$env:LEGACY_RESULT native=$env:NATIVE_RESULT"
          }
          Write-Output 'Legacy reference and native Godot regressions passed.'
