<main>
<header><div><div class="eyebrow">荒原回响 / 动作试作 01</div><h1>巡线者 · 转向与持枪</h1><p>紧凑像素人物，短步移动、全周瞄准和独立开火反馈。</p></div><span class="badge">主角内部样板</span></header>
<div class="panel toolbar">
<label>演示 <select id="mode"><option value="moving">移动＋射击</option><option value="turn">原地环绕瞄准</option><option value="strafe">横移瞄准</option><option value="reverse">反向移动射击</option><option value="free">自由操作</option></select></label>
<button id="free" class="primary">亲自操作</button><button id="pause">暂停</button><button id="reset">重置</button>
<label>速度 <select id="speed"><option value="1">正常</option><option value="0.5">半速</option><option value="0.25">慢放</option></select></label>
<label>人物大小 <select id="zoom"><option value="1">小尺寸</option><option value="2" selected>游戏参考尺寸</option><option value="3">放大观察</option></select></label>
<label><input id="shoot" type="checkbox" checked>演示开火</label><label><input id="guides" type="checkbox">瞄准参考线</label>
</div>
<div class="panel viewer"><canvas id="stage" width="960" height="560" tabindex="0" aria-label="主角动作试验场，可以使用WASD移动、鼠标瞄准和左键射击"></canvas><span class="viewer-note" id="sceneLabel">素材加载中</span></div>
<div class="panel lower"><div><div class="keys"><span><kbd>WASD</kbd> / <kbd>方向键</kbd> 移动</span><span>鼠标 瞄准</span><span><kbd>左键</kbd> / <kbd>空格</kbd> 射击</span><span><kbd>P</kbd> 暂停</span></div><p class="small">右侧可固定查看八个方向。向上瞄准时，枪从头侧露出；灰色箱体可用于检查撞墙停步与子弹阻挡。</p><div id="status" class="stats" role="status" aria-live="polite">正在准备人物素材…</div></div><div class="directions" aria-label="固定瞄准方向"><button data-angle="-135" aria-label="左上">↖</button><button data-angle="-90" aria-label="正上">↑</button><button data-angle="-45" aria-label="右上">↗</button><button data-angle="180" aria-label="正左">←</button><span>方向</span><button data-angle="0" aria-label="正右">→</button><button data-angle="135" aria-label="左下">↙</button><button data-angle="90" aria-label="正下">↓</button><button data-angle="45" aria-label="右下">↘</button></div></div>
