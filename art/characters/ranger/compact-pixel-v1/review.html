<div class="detail"><span class="tag">静态人物 · 默认服饰</span><h2>先看人物是否清楚、耐看</h2><p>大头短身，缩短外套和四肢；用眼部、围巾和枪械轮廓建立识别点。</p><div class="samples"><div class="sample dark"><img src="ranger-compact-v1.png" alt="深背景小尺寸人物"></div><div class="sample light"><img src="ranger-compact-v1.png" alt="浅背景小尺寸人物"></div></div><p class="caption">小图可见人物高度约72px。实际显示会受窗口及系统缩放影响。</p><p>本页用于查看静态形象，当前游戏尚未替换该人物。</p><p><a href="ranger-compact-v1.png">查看透明原图</a> · <a href="README.md">查看制作记录</a></p></div>
